<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问题管理系统</title>
  <link rel="stylesheet" href="/vendor/material-symbols.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="review-shell">
    <aside class="queue-pane" aria-labelledby="queueTitle">
      <header class="queue-header">
        <div class="queue-heading">
          <h1 id="queueTitle"><span class="material-symbols-rounded" aria-hidden="true">view_list</span>问题队列</h1>
          <span id="reviewCount">0 个</span>
        </div>
        <div class="queue-actions">
          <button class="text-button" id="toggleNewIssue" type="button" aria-expanded="false" aria-controls="newIssuePanel">
            <span class="material-symbols-rounded" aria-hidden="true">add</span>新增议题
          </button>
        </div>
      </header>

      <section class="new-issue-panel hidden" id="newIssuePanel" aria-label="新增议题">
        <label for="newIssueText">议题描述</label>
        <textarea id="newIssueText" rows="3" placeholder="简述议题（必填）"></textarea>
        <div class="new-issue-fields">
          <label for="newIssuePriority">严重程度
            <select id="newIssuePriority">
              <option value="" selected disabled>选择严重度</option>
              <option value="S1">S1 · 高风险</option>
              <option value="S2">S2 · 待关注</option>
              <option value="S3">S3 · 一般</option>
            </select>
          </label>
          <label for="newIssueCategory">分类
            <select id="newIssueCategory"></select>
          </label>
        </div>
        <button class="button primary full-width" id="addIssue" type="button">
          <span class="material-symbols-rounded" aria-hidden="true">add</span>添加议题
        </button>
      </section>

      <section class="queue-list" aria-labelledby="riskSortTitle">
        <div class="queue-list-header">
          <h2 id="riskSortTitle">按风险排序</h2>
          <span id="reviewProblemCount">0 个</span>
        </div>
        <div class="queue-items" id="reviewProblemList"></div>
      </section>
    </aside>

    <section class="question-workspace-pane" aria-label="Review 问题库">
      <div id="serverBanner" class="server-banner hidden" role="status"></div>
      <div class="workspace-content">
        <div class="empty-state" id="reviewEmpty">请先从左侧问题队列中选择一个议题。</div>
        <div id="activeReviewArea" class="active-review hidden">
          <div class="question-chain" id="questionChain"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/model-data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
